services:
  app:
    build: .
    ports:
      - "4481:4481"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=ecto://postgres:${POSTGRES_PASSWORD}@db/antisocial_prod
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_HOST=${PHX_HOST:-antisocial.rprxy.mdma.sh}
      - PORT=4481
      - IDLE_LOCK_MINUTES=${IDLE_LOCK_MINUTES:-10}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=antisocial_prod
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
